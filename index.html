<title>Shared Collect MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--panel2:#fafbfc;--ink:#10131f;--ink2:#474d63;--ink3:#7a8096;--line:#e3e6ed;--line2:#eef0f4;
  --accent:#2f5bff;--accent-ink:#ffffff;--accent-soft:#eaf0ff;
  --ok:#0f7f55;--ok-soft:#e3f5ec;--warn:#9a5b00;--warn-soft:#fff2d9;--bad:#c23434;--bad-soft:#fde9e9;
  --ai:#6345f0;--ai-soft:#efebff;--rules:#0d6e80;--rules-soft:#e1f3f6;
  --rail:#0a0b10;--rail-ink:#c9cbd6;--rail-ink2:#7b7f92;--shadow:0 1px 2px rgba(16,19,31,.05),0 4px 16px rgba(16,19,31,.05);
  --wa-bg:#0b141a;--wa-in:#202c33;--wa-out:#005c4b;--wa-ink:#e9edef;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0e14;--panel:#141720;--panel2:#181b25;--ink:#e8eaf2;--ink2:#b3b8c9;--ink3:#80859a;--line:#262a37;--line2:#1e222d;
    --accent:#6b8cff;--accent-ink:#0c0e14;--accent-soft:#1c2547;
    --ok:#4cc58f;--ok-soft:#12291f;--warn:#f0b24a;--warn-soft:#2c2210;--bad:#f07a7a;--bad-soft:#321617;
    --ai:#a493ff;--ai-soft:#231d42;--rules:#5fc4d6;--rules-soft:#10282d;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0e14;--panel:#141720;--panel2:#181b25;--ink:#e8eaf2;--ink2:#b3b8c9;--ink3:#80859a;--line:#262a37;--line2:#1e222d;
  --accent:#6b8cff;--accent-ink:#0c0e14;--accent-soft:#1c2547;
  --ok:#4cc58f;--ok-soft:#12291f;--warn:#f0b24a;--warn-soft:#2c2210;--bad:#f07a7a;--bad-soft:#321617;
  --ai:#a493ff;--ai-soft:#231d42;--rules:#5fc4d6;--rules-soft:#10282d;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-size:.92em}
.mute{color:var(--ink3)}.ink2{color:var(--ink2)}
.small{font-size:12.5px}.tiny{font-size:11.5px}
.serif{font-family:var(--serif);font-weight:400}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:8px;color:#fff;font-weight:600;font-size:13px;padding:0 6px}
.eyebrow{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-ink2);padding:14px 6px 2px}
.agent{font-family:var(--serif);font-size:22px;line-height:1.15;color:#fff;padding:0 6px}
.status{display:flex;align-items:center;gap:7px;font-size:12px;padding:6px 6px 14px;color:var(--rail-ink)}
.dot{width:7px;height:7px;border-radius:50%;background:#7b7f92;flex:none}.dot.on{background:#3ecf8e}.dot.mid{background:#f0b24a}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--rail-ink);font-size:13.5px;white-space:nowrap}
.nav button:hover:not(:disabled){background:#1a1c25}
.nav button.on{background:#1f2230;color:#fff}
.nav button:disabled{opacity:.35;cursor:not-allowed}
.nav .badge{margin-left:auto;background:#6345f0;color:#fff;border-radius:10px;font-size:11px;padding:0 7px;line-height:18px}
.rail .grow{flex:1}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.crumb{font-size:12.5px;color:var(--ink3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{color:var(--ink);font-weight:500}
.top .right{margin-left:auto;display:flex;gap:8px;flex:none}
.content{padding:24px 28px 120px;max-width:1180px;width:100%;min-width:0}
h1{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.1;margin:0 0 4px;letter-spacing:-.005em}
h2{font-size:15px;font-weight:600;margin:0 0 10px}
h3{font-size:13.5px;font-weight:600;margin:0 0 8px}
h4{font-size:12px;font-weight:600;margin:14px 0 6px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
p{margin:0 0 8px}
.lede{color:var(--ink2);margin:0 0 20px;max-width:720px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card+.card{margin-top:14px}
.g2>.card+.card,.g2e>.card+.card,.pcards>.card+.card{margin-top:0}
.g2+.card,.g2e+.card,.card+.g2e,.card+.g2{margin-top:14px}
.stack>*+*{margin-top:14px}
.g2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.g2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.g2>*,.g2e>*,.tiles>*{min-width:0}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .k{font-size:11.5px;color:var(--ink3)}.tile .v{font-size:22px;font-weight:600;font-family:var(--mono);letter-spacing:-.02em;margin-top:2px}
.tile .s{font-size:11.5px;color:var(--ink3)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500;line-height:1.3;text-align:left}
.btn:hover:not(:disabled){border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2);padding:6px 8px}
.btn.ghost:hover:not(:disabled){background:var(--line2);border-color:transparent}
.btn.link{background:none;border:none;color:var(--accent);padding:2px 0;font-weight:500}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.big{padding:10px 16px;font-size:14px}
.btn.wide{width:100%;justify-content:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--line2);color:var(--ink2);white-space:nowrap;line-height:18px;vertical-align:middle}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ai{background:var(--ai-soft);color:var(--ai)}.pill.rules{background:var(--rules-soft);color:var(--rules)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.prov{text-decoration:underline dotted var(--warn);text-underline-offset:3px;text-decoration-thickness:1.5px}
.wrap{overflow-x:auto;max-width:100%}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:500;color:var(--ink3);font-size:11.5px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
table.t tr:last-child td{border-bottom:none}
table.t tfoot td{border-top:1px solid var(--line);font-weight:600}
input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
input:disabled,select:disabled,textarea:disabled{opacity:.6}
textarea{resize:vertical;min-height:110px;line-height:1.5}
label.f{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px;font-weight:500}
.money{display:flex;align-items:center;gap:0;min-width:110px}
.money span{padding:7px 0 7px 9px;border:1px solid var(--line);border-right:none;border-radius:8px 0 0 8px;background:var(--panel2);color:var(--ink3)}
.money input{border-radius:0 8px 8px 0;font-family:var(--mono)}
.note{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink2)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.note.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.reason{font-size:12px;color:var(--ink3);margin-top:6px}
.sep{height:1px;background:var(--line);margin:14px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.btn.chip{border-radius:999px;padding:5px 12px;font-size:12.5px}
.check{display:flex;flex-direction:column;gap:8px}
.check button{all:unset;box-sizing:border-box;display:flex;gap:14px;align-items:center;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer}
.check button:hover{border-color:var(--ink3)}
.check button.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.check .num{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.check .done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.check .t1{font-weight:600}.check .t2{font-size:12.5px;color:var(--ink3)}
.here{margin-left:auto;font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:62px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:12.5px}
.bar .track{height:12px;background:var(--line2);border-radius:6px;overflow:hidden;display:flex}
.bar .seg{height:100%}.seg.rec{background:var(--ok)}.seg.due{background:var(--warn)}.seg.out{background:var(--bad)}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13px}
.kv .n{font-family:var(--mono);text-align:right}
.kv .tot{font-weight:600;border-top:1px solid var(--line);padding-top:4px}
.quote{background:var(--panel2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 14px;margin:10px 0;font-size:14px;max-width:560px}
.quote small{display:block;color:var(--ink3);font-size:11.5px;margin-top:4px}
.draft{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2);font-size:13px;white-space:pre-wrap}
.drafts{display:grid;gap:8px}
.drafts .opt{all:unset;box-sizing:border-box;display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:13px;background:var(--panel2)}
.drafts .opt:hover{border-color:var(--accent)}
.drafts .opt b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:3px}
.dec-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dec.closed{opacity:.85}
.feed .r{display:grid;grid-template-columns:62px 62px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px}
.feed .r:last-child{border-bottom:none}
.who{font-size:11px;font-weight:600}
.who.AI{color:var(--ai)}.who.You{color:var(--accent)}.who.Payer{color:var(--ok)}.who.System{color:var(--ink3)}
.progress{height:10px;background:var(--line2);border-radius:5px;overflow:hidden;display:flex;margin:6px 0 14px}
.progress div{height:100%}
.install{max-width:560px;margin:40px auto}
.install .card{padding:28px}
.tiles-types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.tiles-types button{all:unset;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;font-size:13px;font-weight:500;display:flex;gap:8px;align-items:center}
.tiles-types button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.irow{display:flex;gap:12px;align-items:flex-start;font-size:13px;color:var(--ink2);padding:8px 0}
.irow svg{margin-top:2px;color:var(--accent)}
.phone{width:380px;max-width:100%;margin:0 auto;border:10px solid #0a0b10;border-radius:34px;background:var(--panel);overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.12)}
.phone .in{padding:20px 18px 18px;min-height:560px}
.phone .fac{font-weight:600;font-size:15px}
.phone .amt{font-family:var(--mono);font-size:32px;font-weight:600;letter-spacing:-.03em;margin:8px 0 2px}
.phone .foot{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:16px}
.banner{border-radius:10px;padding:10px 12px;font-size:12.5px;margin:10px 0}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.contract{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;color:var(--ink2);margin:12px 0;background:var(--panel2)}
.lines .ln{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:10px;width:100%;padding:9px 0;border-bottom:1px solid var(--line2);cursor:pointer;font-size:13px}
.lines .ln:hover .nm{color:var(--accent)}
.lines .ln .n{font-family:var(--mono)}
.lines .ln small{display:block;color:var(--ink3);font-size:11.5px}
.overlay{position:fixed;inset:0;background:rgba(8,10,16,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--panel);border-radius:16px;width:560px;max-width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sheet .hd h2{margin:0;font-size:16px}
.sheet .hd .btn{margin-left:auto}
.menu{display:flex;flex-direction:column}
.menu .btn{border:none;border-bottom:1px solid var(--line2);border-radius:0;padding:12px 4px;justify-content:flex-start;width:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:10px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
.fab{position:fixed;right:18px;bottom:18px;z-index:30;background:#0a0b10;color:#fff;border:1px solid #2a2d3a;border-radius:999px;padding:10px 16px;display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);z-index:35;overflow:auto;padding:18px;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.drawer .hd{background:#0a0b10;color:#fff;margin:-18px -18px 14px;padding:14px 18px}
.drawer .hd b{display:block}
.drawer .hd small{color:#9a9eb0}
.drawer h3{margin-top:16px}
.drawer .ev{display:flex;gap:8px;font-size:12.5px;padding:4px 0;color:var(--ink2)}
.drawer .ev .mono{width:56px;flex:none;color:var(--ink3)}
.dcol{display:flex;flex-direction:column;gap:6px}
.dcol .btn{justify-content:flex-start}
.wa{background:var(--wa-bg);border-radius:14px;padding:14px;color:var(--wa-ink);max-width:440px}
.wa .b{background:var(--wa-in);border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:8px;white-space:pre-wrap}
.wa .b.me{background:var(--wa-out);margin-left:40px}
.wa .codes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.wa .codes .btn{background:#1f2c34;border-color:#2a3942;color:var(--wa-ink);justify-content:flex-start}
.tg{all:unset;box-sizing:border-box;width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg.on{background:var(--ok)}.tg.on::after{left:16px}
.prow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}
.prow:last-child{border-bottom:none}
.prow .grow{flex:1;min-width:0}
.steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.steps .chip b{font-family:var(--mono)}
.exc{border:1px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:12px 14px}
.exc+.exc{margin-top:8px}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.strip>div{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start;min-width:0}
.strip svg{color:var(--ok);margin-top:2px}
.strip .x svg{color:var(--warn)}
.hstrip{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;flex-wrap:wrap}
.hstrip b{font-weight:600}
.pcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pcards .card+.card{margin-top:0}
.pcards>*{min-width:0}
.big{font-family:var(--mono);font-size:20px;font-weight:600}
.empty{text-align:center;padding:36px 16px;color:var(--ink3)}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 10px;gap:6px}
  .rail .eyebrow,.rail .agent,.rail .status,.rail .grow{display:none}
  .nav{flex-direction:row;gap:2px}
  .brand span{display:none}
  .top{position:static;padding:10px 16px}
  .top .right .pill.st{display:none}
  .content{padding:16px 16px 120px}
  .g2,.g2e,.pcards{grid-template-columns:minmax(0,1fr)}
  .tiles,.tiles.t3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip{grid-template-columns:minmax(0,1fr)}
  h1{font-size:27px}
  .install{margin:8px auto}
  .install .card{padding:18px}
  .feed .r{grid-template-columns:48px 50px minmax(0,1fr);gap:6px}
}
</style>

<div id="app"></div>

// Allocate an integer amount by weights, largest remainder; ties go to the lowest running total.
function allocate(amount, weights, running){
  running = running || {};
  const ids = Object.keys(weights).filter(i => weights[i] > 0);
  const out = {}, exact = {};
  Object.keys(weights).forEach(i => { out[i] = 0; exact[i] = 0; });
  const W = ids.reduce((s, i) => s + weights[i], 0);
  if(!W || !amount) return {out, exact};
  let used = 0;
  ids.forEach(i => { exact[i] = amount * weights[i] / W; out[i] = Math.floor(exact[i] + 1e-9); used += out[i]; });
  const order = ids.slice().sort((a, b) => {
    const fa = exact[a] - out[a], fb = exact[b] - out[b];
    if(Math.abs(fa - fb) > 1e-9) return fb - fa;
    return ((running[a] || 0) + out[a]) - ((running[b] || 0) + out[b]) || a.localeCompare(b);
  });
  for(let k = 0; k < amount - used; k++) out[order[k % order.length]]++;
  return {out, exact};
}
// Per line, allocate to the rupee so each line sums exactly.
function computeShares(lines, counts){
  const total = {A:0,B:0,C:0,D:0}, byLine = {};
  lines.forEach(L => {
    const amt = Math.round(L.amount || 0);
    let res, w = {};
    if(L.mode === 'count'){
      const c = (counts && counts[L.unit]) || {};
      PAY.forEach(i => w[i] = +c[i] || 0);
      res = allocate(amt, w, total);
    } else if(L.mode === 'third'){
      const d = Math.floor(amt / 3);
      w = {A:1,B:1,C:1};
      const r = allocate(amt - d, w, total);
      res = {out:{...r.out, D:d}, exact:{...r.exact, D:amt / 3}};
    } else {
      PAY.forEach(i => w[i] = 1);
      res = allocate(amt, w, total);
    }
    byLine[L.key] = {out:res.out, exact:res.exact, w, W:Object.values(w).reduce((s, x) => s + x, 0)};
    PAY.forEach(i => total[i] += res.out[i] || 0);
  });
  return {total, byLine};
}
// Keyword parser standing in for the rule-drafting model (same contract: text -> {lines, confidence, hits}).
function parseRule(text, baseLines, units){
  const t = String(text || '').toLowerCase();
  const sentences = t.split(/(?<=[.!?\n])\s+/).filter(Boolean);
  let hits = 0;
  const lines = baseLines.map(L => {
    const s = sentences.find(x => L.kw.some(k => x.includes(k)));
    if(!s) return {...L, amount:0, mode:'equal', unit:null, found:false};
    const m = s.match(/(?:₹|rs\.?|inr)\s*([\d,]+)/i) || s.match(/\b(\d{1,3}(?:,\d{2,3})+|\d{4,})\b/);
    const amount = m ? +m[1].replace(/,/g, '') : 0;
    let mode = 'equal', unit = null;
    const u = units.find(u => s.includes(u) || s.includes(u.replace(/s$/, '')));
    if(/third|⅓|1\/3/.test(s)) mode = 'third';
    else if(u && /\bby\b|per |according|usage|number/.test(s)){ mode = 'count'; unit = u; }
    if(amount) hits++;
    return {...L, amount, mode, unit, found:!!amount};
  });
  const confidence = hits ? Math.min(0.94, 0.58 + 0.09 * hits) : 0.2;
  return {lines, confidence, hits};
}
// Reply-intent classifier standing in for the intent model (same contract: text -> {intent, why}).
function classify(text){
  const t = String(text || '').toLowerCase();
  if(/tight|time|tak kar|\btak\b|later|next week|thoda|after|salary aaye|by the \d+/.test(t))
    return {intent:'request-time', why:'Asks for more time and names a date (“20 tak”), with a commitment (“pakka”).'};
  if(/wrong|galat|not mine|didn.t use|dispute/.test(t)) return {intent:'dispute', why:'Says a number is wrong.'};
  if(/\?|why|how|kyun|kaise/.test(t)) return {intent:'question', why:'Asks how something was computed.'};
  if(/paid|kar diya|done|sent/.test(t)) return {intent:'paid-claim', why:'Says the payment was made.'};
  return {intent:'other', why:'No clear intent.'};
}
// Pure cash calendar: what is needed by a date vs what is expected by it.
function cashGap(outflows, inflows, by){
  const b = dayNum(by);
  const need = outflows.filter(o => dayNum(o.date) <= b).reduce((s, o) => s + o.amt, 0);
  const inflow = inflows.filter(x => dayNum(x.d) <= b).reduce((s, x) => s + x.amt, 0);
  return {need, inflow, gap:Math.max(0, need - inflow)};
}

function attrs(o){ return Object.entries(o || {}).filter(([, v]) => v !== undefined && v !== null).map(([k, v]) => ` data-${k}="${esc(v)}"`).join(''); }
function b(label, action, o){

}
const pill = (t, c) => `<span class="pill ${c || ''}">${t}</span>`;

const handlesStrip = () => `<div class="hstrip">${ic('users')}<span><b>Agent handles ${nHandled()} of 3</b> <span class="mute">· all 3 invoiced</span></span>${S.active ? '' : ` <span class="mute small">· activates at the first acceptance</span>`}</div>`;

/* ---------- P1 Overview ---------- */
function pOverview(){
  if(!(S.active || S.billed)){
    const steps = [
      ['Describe the rule','Paste how you split costs today. The agent drafts a rule you check line by line.', ruleReady()],
      ['Invite stakeholders',`Send rule v${S.ruleVersion} on WhatsApp. Each stakeholder sees their own page and the math.`, S.sentRule],
      ['Stakeholders accept','The agent activates itself at the first acceptance.', S.active],
      ['First billing run',`Bill ${CYCLE} usage through Razorpay Invoices and Smart Collect.`, S.billed]];
    const cur = steps.findIndex(s => !s[2]);
    return `<h1>${esc(S.merchant)}</h1><p class="lede">Four steps to a running agent. Each opens the page where it happens.</p>
    <div class="check">${steps.map((s, i) => `<button type="button" class="${s[2] ? 'done' : ''} ${i === cur ? 'cur' : ''}" data-action="goStep" data-arg="${i}">
      <span class="num">${s[2] ? ic('check') : i + 1}</span><span><span class="t1">${s[0]}</span><br><span class="t2">${s[1]}</span></span>
      ${i === cur ? `<span class="here">You are here · continue →</span>` : ''}</button>`).join('')}</div>
    ${recent(6)}`;
  }
  const sh = shares(), p = pool(), m = metrics();
  const n = openItems().length;
  return `<h1>${esc(S.merchant)}</h1><p class="lede">${CYCLE} usage · due ${fd(DUE)} (never moved by a plan).</p>
  ${handlesStrip()}
  <div class="tiles">
    <div class="tile"><div class="k">Pool</div><div class="v">${fmt(p)}</div><div class="s">${S.lines.length} cost lines</div></div>
    <div class="tile"><div class="k">Collected</div><div class="v">${pct(m.coll, p)}%</div><div class="s">${fmt(m.coll)}</div></div>
    <div class="tile"><div class="k">Covered by original due</div><div class="v">${pct(m.byDue, p)}%</div><div class="s">incl. your own share</div></div>
    <div class="tile"><div class="k">External by due</div><div class="v">${pct(m.extByDue, m.extTotal)}%</div><div class="s">${fmt(m.extByDue)} of ${fmt(m.extTotal)}</div></div>
    <div class="tile"><div class="k">Decisions</div><div class="v">${n}</div><div class="s">${n ? 'waiting for you' : 'nothing waiting'}</div></div>
  </div>
  ${n ? `<div class="card" style="border-color:var(--ai)"><div class="row sb"><div><h2 style="margin:0">${n} decision${n > 1 ? 's' : ''} waiting</h2><div class="small mute">${openItems().map(i => `${esc(nm(i.from))} · ${kindLabel(i)}`).join(' · ')}</div></div>${b('Open decisions', 'nav', {arg:'decisions', cls:'primary', icon:'inbox'})}</div></div>` : ''}
  ${!S.billed ? `<div class="card"><div class="row sb"><div><h2 style="margin:0">Billing run · ${CYCLE} usage</h2><div class="small mute">${billingStatus()[0]}</div></div>${b('Open billing run', 'nav', {arg:'usage', cls:'primary', icon:'doc'})}</div></div>` : ''}
  <div class="card"><h2>Stakeholders${provPill()}</h2><div class="wrap"><table class="t">
    <thead><tr><th>Payer</th><th class="n">Share</th><th class="n">Paid</th><th>State</th><th>Last contact</th><th>Next</th></tr></thead>
    <tbody>${PAY.map(id => { const last = S.sent.filter(s => s.to === id).slice(-1)[0];
      return `<tr><td>${b(esc(nm(id)), 'openPage', {arg:id, cls:'link'})}${id === 'A' ? ' <span class="mute small">you</span>' : ''}</td><td class="n">${M(sh[id])}</td><td class="n">${fmt(S.paid[id])}</td><td>${stateCell(id)}</td><td class="small">${last ? fd(last.t) : '—'}</td><td class="small">${nextFor(id)}</td></tr>`; }).join('')}</tbody>
  </table></div></div>
  <div class="g2e" style="margin-top:14px">${cashCard()}${perfCard()}</div>
  ${recent(6)}`;
}
function stateCell(id){
  const r = remaining(id), sh = shares()[id];
  if(id === 'A') return S.billed ? pill('booked', 'ok') : pill('own share');
  if(!S.billed) return pill('not billed');
  if(r === 0) return pill('paid', 'ok');
  const plan = (id === 'C' && S.planC && S.planC.sent) || (S.plans[id] && S.plans[id].accepted);
  if(S.paid[id] > 0) return pill(plan ? 'plan · part-paid' : 'part-paid', 'acc');
  if(plan) return pill('plan', 'acc');
  if(!handled(id)) return pill('ledger only');
  return dayNum(S.today) > dayNum(DUE) ? pill('late', 'bad') : pill('open', 'warn');
}
function nextFor(id){
  if(id === 'A') return '—';
  if(!S.billed) return 'Invoice after counts';
  if(remaining(id) === 0) return '—';
  const s = sched(id)[0];
  if(!handled(id)) return `Invoice only · expected ${fd(s.d)}`;
  if(id === 'C' && S.planC && S.planC.sent) return `Plan: ${fmt(s.amt)} by ${fd(s.d)}`;
  if(S.plans[id] && S.plans[id].accepted) return `Agreed: by ${fd(s.d)}`;
  return `Watching · due ${fd(DUE)}`;
}
function cashCard(){
  const kd = keyDate(), g = cashAt(kd), inf = inflows(), sh = shares();
  const dates = [...new Set([DUE, ...S.outflows.map(o => o.date)])].sort((a, b) => dayNum(a) - dayNum(b));
  const max = Math.max(pool(), 1);
  const rows = dates.map(d => {
    const rec = PAY.reduce((s, id) => s + S.paidDates[id].filter(p => dayNum(p.d) <= dayNum(d)).reduce((a, p) => a + p.amt, 0), 0);
    const recAll = rec;
    const dueBy = PAY.reduce((s, id) => s + sched(id).filter(x => dayNum(x.d) <= dayNum(d)).reduce((a, x) => a + x.amt, 0), 0);
    const out = S.outflows.filter(o => o.date === d).reduce((s, o) => s + o.amt, 0);
    return `<div class="bar"><span class="mono">${fd(d)}</span><div class="track"><div class="seg rec" style="width:${recAll / max * 100}%"></div><div class="seg due" style="width:${dueBy / max * 100}%"></div></div><span class="small mute">${out ? `<span style="color:var(--bad)">−${fmt(out)}</span>` : d === DUE ? 'due date' : ''}</span></div>
    ${out ? `<div class="bar"><span></span><div class="track"><div class="seg out" style="width:${out / max * 100}%"></div></div><span class="tiny mute">${esc(S.outflows.filter(o => o.date === d).map(o => o.name).join(', '))}</span></div>` : ''}`;
  }).join('');
  return `<div class="card"><div class="row sb"><h2 style="margin:0">Cash calendar ${RULESp()}</h2><div class="legend"><span><i style="background:var(--ok)"></i>received</span><span><i style="background:var(--warn)"></i>still due</span><span><i style="background:var(--bad)"></i>outflows</span></div></div>
  <div class="bars" style="margin-top:12px">${rows}</div>
  <div class="sep"></div>
  <div class="kv"><span>Needed by ${fd(kd)}</span><span class="n">${fmt(g.need)}</span><span>Expected by then</span><span class="n">${fmt(g.inflow)}</span><span class="tot">Gap</span><span class="n tot" style="color:${g.gap ? 'var(--bad)' : 'var(--ok)'}">${fmt(g.gap)}</span></div>
  <p class="tiny mute" style="margin-top:8px">Expected = cash in hand + shares on track or planned before ${fd(kd)}.</p></div>`;
}
function perfCard(){
  const decided = S.inbox.filter(i => i.status !== 'open');
  const asIs = decided.filter(i => i.status === 'approved').length;
  const sentByAgent = S.sent.filter(s => !s.auto && s.via === 'agent').length;

function recent(n){

function cashLine(id, date){

  const g = cashAt(kd); S.plans[id] = save; if(!save) delete S.plans[id];

function counterLine(i){

  return `With their dates the ${fd(kd)} gap would be ${fmt(g.gap)} (your ask: ${fmt(g2.gap)}). ${RULESp()}`;

}
function watching(){

function basisLine(L, id){

/* ---------- P8 Month report ---------- */
function metrics(){
  const sh = shares(), p = pool();
  let byDue = 0, extByDue = 0, extTotal = 0, coll = 0, agentBrought = 0;
  PAY.forEach(id => {
    S.paidDates[id].forEach(x => { coll += x.amt; if(dayNum(x.d) <= dayNum(DUE)){ byDue += x.amt; if(id !== 'A') extByDue += x.amt; } });
    if(id !== 'A') extTotal += sh[id];
  });
  const planned = id => (id === 'C' && S.planC && S.planC.sent) || (S.plans[id] && S.plans[id].accepted && S.plans[id].viaAgent);
  EXT.forEach(id => { if(planned(id)) agentBrought += S.paidDates[id].filter(x => dayNum(x.d) <= dayNum(DUE)).reduce((s, x) => s + x.amt, 0); });
  return {p, byDue, extByDue, extTotal, coll, agentBrought};
}
function adherence(){
  const inst = [];
  if(S.planC && S.planC.sent && S.planAccepted){ inst.push({id:'C', d:S.planC.d1, cum:S.planC.inst1}); if(S.planC.inst2) inst.push({id:'C', d:S.planC.d2, cum:S.planC.inst1 + S.planC.inst2}); }
  EXT.forEach(id => { if(S.plans[id] && S.plans[id].accepted) inst.push({id, d:S.plans[id].date, cum:shares()[id]}); });
  const due = inst.filter(x => dayNum(x.d) <= dayNum(S.today));
  const met = due.filter(x => S.paidDates[x.id].filter(p => dayNum(p.d) <= dayNum(x.d)).reduce((s, p) => s + p.amt, 0) >= x.cum).length;
  return {met, n:due.length, total:inst.length};
}

  </div>

    <div class="card"><h2>Proposals this cycle</h2><div class="kv">

      <span>Executed (sent)</span><span class="n">${executed}</span>

  </div>

  ${S.open.how ? `<div class="small" style="margin-top:10px"><p><b>Covered by original due</b> = everything in the account by ${fd(DUE)}, including your own share booked at the billing run, ÷ the pool.</p>

}

    else if(L.mode === 'third') eq = id === 'D' ? `⅓ × ${fmt(L.amount)} = ${dec(L.amount / 3)} → <b>${fmt(r.out[id])}</b> (rounded down)` : `(${fmt(L.amount)} − ${fmt(r.out.D)}) ÷ 3 = ${dec(r.exact[id])} → <b>${fmt(r.out[id])}</b>`;

  } else if(kind === 'request-time'){

  } else if(kind === 'neft'){

  } else if(kind === 'menu'){

      <div class="row" style="margin-top:12px">${b('Payment details', 'openSheet', {cls:'sm', icon:'pay', d:{kind:'neft', id}})}${b('Copy invoice link', 'copy', {cls:'sm', icon:'copy', d:{text:`https://rzp.io/i/${inv.no.toLowerCase()}`}})}${b('Open their page', 'openPage', {arg:id, cls:'sm ghost', icon:'eye'})}</div>`;
  } else if(kind === 'source'){
    const id = p.id;
    if(id === 'invoices' || id === 'whatsapp'){
      const on = S.sources[id];
      title = id === 'invoices' ? 'Invoices & Smart Collect' : 'WhatsApp';
      body = id === 'invoices' ? `<p class="small">Issues each invoice in ${esc(S.merchant)}'s name and gives every stakeholder one persistent Smart Collect virtual account (bank transfer and UPI). Payments reconcile to the invoice automatically.</p><p class="small mute">Disconnecting blocks issuing invoices.</p>`
        : `<p class="small">Sends the rule, the messages you approve, and receives replies. Stakeholders who accepted are messaged only with drafts you approved.</p><p class="small mute">Disconnecting blocks every send — the rule, drafts and replies — with the reason shown on the button.</p>`;

    } else if(id === 'second'){
      title = 'Connect a second source';
      body = `<p class="small">A second count of the same usage — here, the ${esc(T().second)}. The agent compares it with the register before billing and flags any difference with its rupee impact.</p><div class="row">${b('Use sample', 'connectSecond', {cls:'primary sm'})}</div>`;

}

function events(){
  const E = [], c = 'C', d = 'D';
  E.push({id:'counts', d:'2026-09-01', label:`${ownerName() === 'you' ? 'You get' : T().staff + ' sends'} ${CYCLE} counts`, run:() => { if(!S.countsReceived) receiveCounts(S.countsOwner === 'operator' ? 'You' : 'System'); }});
  E.push({id:'bill', d:'2026-09-03', label:'Billing day', gate:() => S.billed ? null : 'Issue invoices first — Usage & billing.', run:() => {}});
  E.push({id:'remind', d:'2026-09-23', label:'Razorpay invoice reminders (7 days before due)', run:() => {
    const to = EXT.filter(id => remaining(id) > 0);
    to.forEach(id => S.sent.push({to:id, t:S.today, text:`Invoice ${S.invoices[id].no}: ${fmt(remaining(id))} due ${fd(DUE)}.`, auto:true}));
    log('System', `Invoice reminders sent to ${to.map(nm).join(', ') || 'nobody'} by Razorpay Invoices.`);
  }});
  E.push({id:'reply', d:'2026-09-25', label:`${nm(c)} replies on WhatsApp`, run:() => {
    if(remaining(c) === 0) return;
    if(!handled(c)){ log('System', `${nm(c)} replied to the invoice reminder. Ledger only — the agent doesn't act on it.`); return; }
    const k = classify(T().reply);
    S.inbox.push({id:'d' + S.seq++, kind:'reply', from:c, t:S.today, quote:T().reply, intent:k.intent, why:k.why, said:'2026-10-20', status:'open'});
    log('Payer', `${nm(c)} replied: “${T().reply}”`);
    log('AI', `Read ${first(c)}'s reply as ${k.intent}. ${S.perms.plan ? `Drafted a plan sized to the ${fd(keyDate({noPlan:true}))} gap.` : 'Plans are off — flagged for you.'}`);
  }});
  if(S.planC && S.planC.sent && !S.planAccepted) E.push({id:'acceptPlan', d:dayNum(S.planC.on) >= dayNum('2026-09-26') ? addDays(S.planC.on, 1) : '2026-09-26', label:`${nm(c)} accepts the plan`, run:() => { if(S.planC && !S.planAccepted && remaining(c) > 0) acceptPlan(c); }});
  E.push({id:'prelate', d:'2026-09-27', label:`Signal on ${nm(d)}`, run:() => {
    if(remaining(d) === 0 || !handled(d) || !S.perms.flag) return;
    S.inbox.push({id:'d' + S.seq++, kind:'prelate', from:d, t:S.today, status:'open', signal:`${first(d)} visits ${T().visit}; the next visit is Tue 29 Sept, the day before due. Paid late in 2 of the last 3 months, each time after a visit.`});
    log('AI', `Flagged ${nm(d)}: likely to pay after the due date. Drafted one nudge.`);
  }});
  E.push({id:'payB', d:'2026-09-28', label:`${nm('B')} pays`, run:() => pay('B', remaining('B'), 'Payer', 'UPI')});
  if(S.planC && S.planAccepted) E.push({id:'payC1', d:S.planC.d1 === DUE ? '2026-09-29' : S.planC.d1, label:`${nm(c)} pays instalment 1`, run:() => pay(c, sched(c)[0] ? sched(c)[0].amt : 0, 'Payer', 'instalment 1 · UPI')});
  E.push({id:'due', d:DUE, label:'Original due date', run:() => { const late = EXT.filter(id => remaining(id) > 0); log('System', `Original due date. ${late.length ? 'Unpaid: ' + late.map(id => `${nm(id)} ${fmt(remaining(id))}`).join(', ') : 'All shares paid.'}`); }});
  [...new Set(S.outflows.map(o => o.date))].sort().forEach(dt => E.push({id:'out:' + dt, d:dt, label:`Outflows: ${S.outflows.filter(o => o.date === dt).map(o => o.name).join(', ')}`, run:() => {
    const inAcc = PAY.reduce((s, id) => s + S.paidDates[id].reduce((a, p) => a + p.amt, 0), 0);
    const outSoFar = S.outflows.filter(o => dayNum(o.date) <= dayNum(dt)).reduce((s, o) => s + o.amt, 0);
    const bal = inAcc - outSoFar;
    log('System', `Paid ${S.outflows.filter(o => o.date === dt).map(o => `${o.name} ${fmt(o.amt)}`).join(', ')}. ${bal < 0 ? `Pool short by ${fmt(-bal)} — covered from ${S.operator}'s reserve.` : `Pool balance ${fmt(bal)}.`}`);
  }}));
  E.push({id:'payC2', d:'2026-10-18', label:`${nm(c)} pays the rest`, run:() => pay(c, remaining(c), 'Payer', S.planC && S.planAccepted ? 'instalment 2 · UPI' : 'UPI')});
  E.push({id:'payD', d:S.plans[d] && S.plans[d].accepted ? S.plans[d].date : '2026-10-18', label:`${nm(d)} pays`, run:() => pay(d, remaining(d), 'Payer', 'UPI')});
  E.push({id:'close', d:'2026-10-31', label:'Month closes', run:() => { S.closed = true; S.page = 'report'; log('System', `${CYCLE} cycle closed.`); }});
  return E.filter(e => !S.done[e.id]).sort((a, b) => dayNum(a.d) - dayNum(b.d));
}

/* ============================================================
   DOMAIN OPERATIONS
   ============================================================ */
function receiveCounts(who){
  S.countsReceived = true; S.grid = false; S.countsDraft = null;
  log(who || 'System', `${CYCLE} counts received from ${ownerName()}.`);
  if(S.billed && S.provisional){
    const actual = computeShares(S.lines, effCounts()).total, billed = S.billedShares, diff = {};
    PAY.forEach(id => diff[id] = actual[id] - billed[id]);
    S.trueUp = {on:S.today, billed:{...billed}, actual, diff};
    S.provisional = false;
    log('System', `True-up for next cycle: ${PAY.map(id => `${nm(id)} ${diff[id] >= 0 ? '+' : '−'}${fmt(Math.abs(diff[id]))}`).join(', ')}. Invoices stay as issued.`);
  }
}
function doIssue(provisional){
  const counts = provisional ? JSON.parse(JSON.stringify(S.prevCounts)) : effCounts();
  S.billedCounts = counts;
  S.billedShares = computeShares(S.lines, counts).total;
  S.billed = true; S.provisional = !!provisional; S.billedOn = S.today;
  const pf = T().prefix;
  EXT.forEach((id, k) => S.invoices[id] = {no:`${pf}-2608-00${k + 2}`, va:`2223 3300 ${String(4417820 + k * 1137).padStart(8, '0').replace(/(\d{4})(\d{4})/, '$1 $2')}`, vpa:`${pf.toLowerCase()}.${id.toLowerCase()}@razorpay`});
  pay('A', S.billedShares.A, 'System', 'your own share, booked');
  log('System', `Issued ${provisional ? 'provisional ' : ''}invoices ${EXT.map(id => `${S.invoices[id].no} ${fmt(S.billedShares[id])}`).join(', ')} with one Smart Collect account each. Due ${fd(DUE)}.`);
}
function acceptRule(id){
  S.consent[id] = true; delete S.declineReason[id];
  log('Payer', `${nm(id)} accepted rule v${S.ruleVersion}.`);
  S.inbox.filter(i => i.kind === 'question' && i.from === id && i.status === 'open').forEach(i => { i.status = 'auto'; i.outcome = 'Closed — they accepted the rule.'; });
  syncActive();
}
function declineRule(id, reason){
  S.consent[id] = false; S.declineReason[id] = reason || 'No reason given';
  log('Payer', `${nm(id)} declined rule v${S.ruleVersion}: “${S.declineReason[id]}”. Ledger only.`);
  syncActive();
}
function acceptPlan(id){
  S.planAccepted = true;
  S.plans.C = {...S.planC, accepted:true, viaAgent:true};
  S.inbox.filter(i => i.kind === 'counter' && i.status === 'open').forEach(i => { i.status = 'auto'; i.outcome = 'Closed — they accepted the plan.'; });
  log('Payer', `${nm(id)} accepted the plan: ${fmt(S.planC.inst1)} by ${fd(S.planC.d1)}${S.planC.inst2 ? `, ${fmt(S.planC.inst2)} by ${fd(S.planC.d2)}` : ''}.`);
}

/* ---------- CSV connector ---------- */
function sampleCsv(){
  const units = Object.keys(S.counts), rows = ['payer,date,resource,count,patient_name,patient_phone,referred_by'];
  PAY.forEach(id => units.forEach((u, k) => { const n = (k === 0 ? AUG[0] : AUG[1])[id], h = Math.floor(n / 2);
    rows.push(`${nm(id)},2026-08-14,${u},${h},R. Sharma,98xxxxxx12,self`); rows.push(`${nm(id)},2026-08-28,${u},${n - h},K. Iyer,98xxxxxx77,Dr Rao`); }));
  return rows.join('\n');
}
function parseCsv(txt){
  const lines = String(txt || '').trim().split(/\r?\n/).filter(Boolean);
  if(lines.length < 2) return {error:'The sheet is empty.'};
  const head = lines[0].split(',').map(h => h.trim().toLowerCase());
  const keep = ['payer','date','resource','count'];
  const missing = keep.filter(k => !head.includes(k));
  if(missing.length) return {error:`Missing column${missing.length > 1 ? 's' : ''}: ${missing.join(', ')}.`};
  const ix = {}; keep.forEach(k => ix[k] = head.indexOf(k));
  const dropped = head.filter(h => !keep.includes(h));
  const units = Object.keys(S.counts), counts = {};
  units.forEach(u => counts[u] = {A:0,B:0,C:0,D:0});
  let bad = 0, n = 0;
  lines.slice(1).forEach(l => {
    const r = l.split(',').map(x => x.trim());
    const pv = (r[ix.payer] || '').toLowerCase();
    const p = S.payers.find(x => x.name.toLowerCase() === pv || x.id.toLowerCase() === pv);
    const u = units.find(x => x === (r[ix.resource] || '').toLowerCase() || x.replace(/s$/, '') === (r[ix.resource] || '').toLowerCase());
    const c = +r[ix.count];
    if(p && u && c >= 0 && !isNaN(c)){ counts[u][p.id] += c; n++; } else bad++;
  });
  return {counts, dropped, n, bad};
}
function applyCsv(txt){
  const r = parseCsv(txt);
  if(r.error){ S.csvMsg = {err:true, text:r.error}; return; }
  S.counts = r.counts;
  S.csvMsg = {err:false, text:`Read ${r.n} rows${r.bad ? `, skipped ${r.bad}` : ''}. Kept payer, date, resource, count.${r.dropped.length ? ` Dropped ${r.dropped.join(', ')} — identities never leave the connector.` : ''}`};
  receiveCounts('You');
  S.csvOpen = true;
}

function advance(){
  const e = events()[0];
  if(!e) return;
  const g = e.gate && e.gate();
  if(g){ toast(g); return; }
  if(dayNum(e.d) > dayNum(S.today)) S.today = e.d;
  S.done[e.id] = true;
  e.run();
}
function playDefault(){
  fresh('clinic', true);
  log('You', 'Workspace created · Meera Diagnostics (Clinic / diagnostics).');
  A.draftRule(); S.setupStep = 'invite';
  A.sendRule();
  EXT.forEach(acceptRule);
  for(let k = 0; k < 60 && !S.closed; k++){
    const e = events()[0];
    if(!e) break;
    if(e.gate && e.gate()){
      if(!S.countsReceived) receiveCounts('System');
      openExc().forEach(x => S.exc[x.key] = 'register');
      if(dayNum(e.d) > dayNum(S.today)) S.today = e.d;
      doIssue(false);
    }
    advance();
    openItems().forEach(i => {
      if(i.kind === 'reply'){ if(!S.tone){ S.tone = 'warm'; log('You', 'Chose a warm tone.'); } approveDraft(i, draftText(i, S.tone), 'approved'); }
      else if(i.kind === 'prelate') approveDraft(i, draftText(i, S.tone || 'warm'), 'approved');
    });
  }
  S.drawer = false; S.page = 'report';
}

const LS = 'shared-collect-v8';
function run(name, el, ev){
  if(!A[name]){ console.error('UNKNOWN ACTION', name); return; }
  A[name](el, ev);
  render();
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]');
  if(!el || el.disabled) return;
  if(el.matches('input,select,textarea')) return;
  if(el.dataset.self && ev.target !== el) return;
  run(el.dataset.action, el, ev);
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if(!el.matches || !el.matches('input[data-action],select[data-action],textarea[data-action]')) return;
  run(el.dataset.action, el, ev);
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if(el.dataset && el.dataset.live){ if(A[el.dataset.live]) A[el.dataset.live](el); else console.error('UNKNOWN ACTION', el.dataset.live); save(); }
});
document.addEventListener('keydown', ev => { if(ev.key === 'Escape' && (S.sheet || S.drawer)){ if(S.sheet) S.sheet = null; else S.drawer = false; render(); } });
function selfCheck(root){
  root.querySelectorAll('button').forEach(btn => {
    const a = btn.dataset.action;
    if(!a) console.error('UNWIRED BUTTON', (btn.textContent || btn.getAttribute('aria-label') || '').trim().slice(0, 60));
    else if(!A[a]) console.error('UNKNOWN ACTION', a);
  });
  root.querySelectorAll('[data-action]:not(button)').forEach(n => { if(!A[n.dataset.action]) console.error('UNKNOWN ACTION', n.dataset.action); });
  root.querySelectorAll('[data-live]').forEach(n => { if(!A[n.dataset.live]) console.error('UNKNOWN ACTION', n.dataset.live); });
}
function render(){
  syncActive();
  const root = document.getElementById('app');
  root.innerHTML = shell();
  selfCheck(root);
  save();
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const s = JSON.parse(localStorage.getItem(LS) || 'null'); if(s && s.payers && s.lines) return s; }catch(e){} return null; }
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
function copyText(text){
  const fallback = () => { try{ const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); toast(ok ? 'Copied' : 'Copy blocked here — select the text instead'); }catch(e){ toast('Copy blocked here — select the text instead'); } };
  try{ if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('Copied'), fallback); else fallback(); }catch(e){ fallback(); }
}

S = load() || fresh('clinic', false);
render();
</script>
